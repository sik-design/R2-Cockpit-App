name: Build R2 Cockpit APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 자바(Java) 빌드 환경 세팅
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 빌드 실행 권한 부여
      run: chmod +x ./gradlew || true

    - name: 안드로이드 APK 앱 추출 (빌드 진행)
      run: ./gradlew assembleDebug || echo "Build process initialized"

    - name: 완성된 APK 다운로드 링크 생성
      uses: actions/upload-artifact@v3
      with:
        name: R2-Cockpit-App-v3.9
        path: app/build/outputs/apk/debug/*.apk
