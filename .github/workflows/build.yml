name: Build R2 Cockpit APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v4

    - name: 자바(Java) 빌드 환경 세팅
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 안드로이드 필수 뼈대 파일 및 파이어베이스 세팅
      run: |
        mkdir -p app/src/main/res/values
        
        # 1. 파이어베이스 열쇠를 app 폴더 안으로 이동 (오류 방지용)
        mv google-services.json app/google-services.json || true
        
        # 2. gradle.properties 생성
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF
        
        # 3. AndroidManifest.xml 생성
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.r2quant.cockpit">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:allowBackup="true" android:label="R2 퀀트" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # 4. app/build.gradle 생성 (파이어베이스 플러그인 장착)
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
            id 'com.google.gms.google-services'
        }
        android {
            namespace 'com.r2quant.cockpit'
            compileSdk 34
            defaultConfig {
                applicationId "com.r2quant.cockpit"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "3.9"
            }
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.core:core-splashscreen:1.0.1'
            implementation platform('com.google.firebase:firebase-bom:32.7.0')
            implementation 'com.google.firebase:firebase-messaging-ktx'
        }
        EOF
        
        # 5. settings.gradle 생성
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "R2Cockpit"
        include ':app'
        EOF
        
        # 6. 프로젝트 최상위 build.gradle 생성 (파이어베이스 지원)
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
            id 'com.google.gms.google-services' version '4.4.0' apply false
        }
        EOF

    - name: 빌드 시스템 권한 세팅
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x ./gradlew

    - name: 안드로이드 APK 앱 추출 (빌드 진행)
      run: ./gradlew assembleDebug

    - name: 완성된 APK 다운로드 링크 생성
      uses: actions/upload-artifact@v4
      with:
        name: R2-Cockpit-App-v3.9
        path: app/build/outputs/apk/debug/*.apk
